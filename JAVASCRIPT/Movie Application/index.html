<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <link rel="stylesheet" href="./index.css"/>
</head>
<body>
    <nav class="navbar">
    <div class="nav-logo">
        <h1>Movies🎥</h1>
    </div>
    <div class="search-bar">
        <input type="text" placeholder="Search movies..." id="search-input" />
    </div>
    <div class="nav-button">
        <button class="nav-btn btn-favourite">Favourite</button>
        <a href="./cart/cart.html"><button class="nav-btn btn-cart">Cart</button></a>
        <div id="auth-section">
            <a href="./Authentication/login.html"><button class="btn-login nav-btn">Login</button></a>
        </div>
    </div>
    </nav>
    <section class="carousal-section">
        <div class="carousal-container" id="carousal-container"></div>
        <button onclick="changeSlide(-1)" class="carousal-btn prev">Pre</button>
        <button onclick="changeSlide(+1)" class="carousal-btn next">Next</button>
    </section>
    <!--Movie Section -->
    <section class="movie-section">
      
        <div id="container">
            <h2>All Movies</h2>
            <div id="movie-container">
                <!-- Cards -->
            </div>
        </div>
    </section>


    <script src="./index.js"></script>
</body>
</html>
